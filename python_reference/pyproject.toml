[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qre"
version = "1.0.0"
description = "Python reference implementation of the qre quantitative risk engine, and its portfolio risk app"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
web = ["yfinance"]
test = ["pytest>=8"]

[project.scripts]
qre-web = "qre.web.__main__:main"
qre-run-py = "qre.engine.run:main"

[tool.setuptools.packages.find]
include = ["qre*"]

[tool.setuptools.package-data]
"qre.web" = ["static/*", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

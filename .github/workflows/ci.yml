name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
   
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++-13 libeigen3-dev
  
      - name: Configure
        run: >
          cmake -B build -S cpp
          -DCMAKE_CXX_COMPILER=g++-13
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DQRE_BUILD_TESTS=ON 
          -DQRE_BUILD_BENCHMARKS=OFF
 
      - name: Build
        run: cmake --build build --parallel
  
      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r python_reference/requirements.txt

      - name: Python tests
        working-directory: python_reference
        run: python -m pytest -q

      #Phase 14: run the production engine in both languages on the real data and fail if they disagree
      - name: End-to-end run, C++ vs Python
        run: |
          build/apps/qre_run --config configs/ci_smoke.conf --output runs/ci_cpp
          PYTHONPATH=python_reference python -m qre.engine.run --config configs/ci_smoke.conf --output runs/ci_py
          PYTHONPATH=python_reference python -m qre.engine.compare runs/ci_cpp runs/ci_py

# qre daily risk run (Phase 14). Run from the repo root:
#   build/apps/qre_run --config configs/daily_risk.conf
#   python -m qre.engine.run --config configs/daily_risk.conf      (from python_reference/, same results)
data        = data/market_data/adjusted_close.csv
weights     = equal
confidence  = 0.99, 0.975
window      = 250
models      = historical, parametric, ewma, fhs, garch, fhs_garch, garch_t, garch_evt
combination = equal         # equal | select | exp (Experiment 18: equal was the most reliable)
lookback    = 100
eta         = 1
burn        = 100
lambda      = 0.94
output      = runs/daily
